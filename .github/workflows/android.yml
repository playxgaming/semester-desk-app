name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check planner calculations
        run: npm run check

      - name: Build the web app
        env:
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
        run: npm run build

      # The checked-in Gradle 8.2.1 wrapper runs on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired "tools" package. Install only
          # the platform and build tools required by the checked-in project.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Copy the build into the Android project
        run: npx cap sync android

      - name: Assemble the demo APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare download
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/semester-desk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: semester-desk-apk-${{ github.sha }}
          path: out/semester-desk.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Android demo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > out/release-notes.md <<'NOTES'
          Download **semester-desk.apk** below and open it on an Android phone.

          This is a debug-signed demo build for sideloading, not a Play Store release. Android will ask you to allow installation from your browser or file manager. Core planning and storage work offline. AI Tutor and Scanner require a separately configured HTTPS backend.

          Export a backup in Settings before replacing an older installation. Debug signing keys can change between builds; Android may require uninstalling the old build, which removes its local data.
          NOTES
          gh release create "$RELEASE_TAG" out/semester-desk.apk \
            --target "$GITHUB_SHA" \
            --title "Semester Desk Android demo ($RELEASE_TAG)" \
            --notes-file out/release-notes.md \
            --latest
