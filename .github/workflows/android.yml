name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check planner calculations
        run: npm run check

      - name: Build the web app
        env:
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
        run: npm run build

      # The checked-in Gradle 8.2.1 wrapper runs on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired "tools" package. Install only
          # the platform and build tools required by the checked-in project.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Copy the build into the Android project
        run: npx cap sync android

      # Every build is signed with the same key from repository secrets, so a
      # newer APK installs over an older one and keeps the user's data. Without
      # the secrets the job stops instead of publishing a randomly signed APK.
      - name: Restore the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (see ANDROID.md, 'Release signing')."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Android refuses an update whose versionCode is not higher than the
          # installed one; the run number rises with every build.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee out-signature.txt
          grep -q "SHA-256 digest" out-signature.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare download
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/semester-desk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: semester-desk-apk-${{ github.sha }}
          path: out/semester-desk.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Android demo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > out/release-notes.md <<'NOTES'
          Download **semester-desk.apk** below and open it on an Android phone.

          This is a sideload build, not a Play Store release. Android will ask you to allow installation from your browser or file manager. Core planning and storage work offline. AI Tutor and Scanner require a separately configured HTTPS backend.

          Every build is signed with the same key, so this APK installs over the previous one and keeps your data. Builds published before stable signing used temporary keys: if Android refuses this update, export a backup in Settings, uninstall the old app once, install this APK and restore the backup.
          NOTES
          gh release create "$RELEASE_TAG" out/semester-desk.apk \
            --target "$GITHUB_SHA" \
            --title "Semester Desk Android demo ($RELEASE_TAG)" \
            --notes-file out/release-notes.md \
            --latest
